name: Build Android APK

on:
  push:
    branches: [ main ]
    paths:
      - 'android-app/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app

    steps:
      # Sparse checkout: grab only the app folder, not the ~629MB of MP3s.
      - name: Checkout (app folder only)
        uses: actions/checkout@v4
        with:
          sparse-checkout: android-app
          sparse-checkout-cone-mode: true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
          build-root-directory: android-app

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Collect APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/BlackAmp.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BlackAmp-APK
          path: android-app/out/BlackAmp.apk

      - name: Publish to Releases
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: BlackAmp Android (latest build)
          body: |
            Automatic build from commit ${{ github.sha }}.

            Download **BlackAmp.apk** below and open it on your phone to install.
            You'll need to allow "install from unknown sources" the first time.
          files: android-app/out/BlackAmp.apk
          fail_on_unmatched_files: true
